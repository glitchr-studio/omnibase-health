    none: Aucun professionnel ne propose de visio pour le moment.
    how: Comment ça marche
    step_1: Prenez rendez-vous, comme pour une consultation au cabinet.
    step_2: 'Dix minutes avant l’heure, ouvrez votre espace patient : le bouton « Rejoindre la visio » apparaît.'
    step_3: Autorisez la caméra et le micro. Vous patientez en salle d’attente, votre soignant vous rejoint.
    privacy: 'L’image et le son vont directement de votre appareil à celui de votre soignant, chiffrés ; rien n’est enregistré et rien ne passe par un prestataire extérieur.'
